spring.application.name=backend
server.port=8080

# Nạp file cấu hình cục bộ nếu có (file này được .gitignore bảo vệ, không commit lên Git)
spring.config.import=optional:classpath:application-local.properties,optional:file:application-local.properties

# Cấu hình Firebase Project pitchcoach-ab4ee
firebase.credentials.path=${FIREBASE_CREDENTIALS_PATH:firebase-service-account.json}
firebase.storage.bucket=${FIREBASE_STORAGE_BUCKET:pitchcoach-ab4ee.firebasestorage.app}

# Cấu hình Google Gemini AI (nhận từ biến môi trường GEMINI_API_KEY hoặc file application-local.properties)
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-2.5-flash}

# Cấu hình dung lượng upload file âm thanh (.m4a / .wav)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
